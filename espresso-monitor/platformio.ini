; ============================================================================
; EspressoMonitor V1  —  ESP32-WROOM-32
; Migrated from Arduino IDE. The display config below is ported verbatim from
; the old TFT_eSPI User_Setup.h + lv_conf.h so behavior matches the working build.
;
;   Build/upload:   pio run -e espresso_monitor -t upload
;   Serial monitor: pio device monitor -b 115200
; (or use the PlatformIO toolbar in VSCode)
; ============================================================================

[env:espresso_monitor]
; pioarduino fork = arduino-esp32 3.x (matches the Arduino IDE core 3.3.8 this
; project is tested on). The official PlatformIO espressif32 still ships 2.0.17,
; which lacks the IDF5 watchdog API (esp_task_wdt_config_t/reconfigure) used here.
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board         = esp32dev
framework     = arduino
monitor_speed = 115200

; "Huge APP (3MB No OTA)" partition scheme — the V1 binary is ~1.8 MB and does
; not fit the default 1.2 MB app partition.
board_build.partitions = huge_app.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@9.5.0
    adafruit/Adafruit MAX31865 library@^1.6.2

; shared ESP-NOW protocol header (used once the monitor receives scale data)
lib_extra_dirs = ../shared

build_flags =
    ; ---------- LVGL ----------
    ; lv_conf.h lives in this project's include/ dir (copied from the working
    ; Arduino setup). Point LVGL straight at it with an absolute path — more
    ; reliable than LV_CONF_INCLUDE_SIMPLE, which failed to resolve when LVGL's
    ; own library sources compiled (their include path didn't see our include/).
    -D LV_CONF_PATH=\"${platformio.include_dir}/lv_conf.h\"

    ; ---------- TFT_eSPI (ported from User_Setup.h) ----------
    ; USER_SETUP_LOADED tells TFT_eSPI to skip its User_Setup.h/Select and use
    ; these flags instead, so the config is version-controlled with the project.
    -D USER_SETUP_LOADED
    -D ILI9341_DRIVER
    -D TFT_MISO=19
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=14
    -D TFT_DC=27
    -D TFT_RST=33
    -D TOUCH_CS=32
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D LOAD_FONT6
    -D LOAD_FONT7
    -D LOAD_FONT8
    -D LOAD_GFXFF
    -D SMOOTH_FONT
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=1000000
