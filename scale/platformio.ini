; ============================================================================
; V2 Scale node  —  ESP32-C3 Super Mini + HX711
;
; ONE firmware, two physical scales, differentiated by the SCALE_ID build flag:
;     pio run -e scale_machine -t upload   ; espresso-machine scale (ID 1)
;     pio run -e scale_grinder -t upload   ; grinder scale        (ID 2)
;
; NOTE: board is the generic C3. If your Super Mini needs a different variant,
; swap `board` (e.g. lolin_c3_mini or seeed_xiao_esp32c3).
; ============================================================================

[env]
; pioarduino fork = arduino-esp32 3.x (matches the rest of the monorepo / Arduino IDE core)
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
framework     = arduino
monitor_speed = 115200

; ---- common settings for both scales (not an env; pulled in via `extends`) ----
[scale_base]
board = esp32-c3-devkitm-1
lib_deps =
    bogde/HX711@^0.7.5
lib_extra_dirs = ../shared
build_flags =
    ; C3 Super Mini exposes Serial over the native USB-CDC port
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:scale_machine]
extends = scale_base
build_flags =
    ${scale_base.build_flags}
    -D SCALE_ID=1

[env:scale_grinder]
extends = scale_base
build_flags =
    ${scale_base.build_flags}
    -D SCALE_ID=2
