; ============================================================================
; Grinder control  —  ESP32-S3
;
; Talks to the grinder scale (ESP-NOW) and relays data to the espresso-monitor
; hub. S3 chosen for the extra I/O / horsepower of controlling the grinder.
;
;   pio run -e grinder_control -t upload
; ============================================================================

[env:grinder_control]
; pioarduino fork = arduino-esp32 3.x (matches the rest of the monorepo)
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board         = esp32-s3-devkitc-1
framework     = arduino
monitor_speed = 115200

lib_extra_dirs = ../shared

build_flags =
    ; S3 dev boards expose Serial over native USB-CDC
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
