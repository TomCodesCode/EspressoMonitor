; ============================================================================
; Grinder control — round display node
; Board: Sunton ESP32-2424S012C = ESP32-C3 + 1.28" GC9A01 240x240 round LCD
;        + CST816 capacitive touch + CH340 USB-serial (NOT native USB).
;
; PHASE B (now): display bring-up test — pure TFT_eSPI, no LVGL/touch yet. Once
; the round screen shows a ring + text, we layer LVGL + CST816 touch + the
; SquareLine UI (Phase C/D), then ESP-NOW from the scale + the SSR relay (Phase E).
;
;   Build/upload:   pio run -e grinder_control -t upload
;   Serial monitor: pio device monitor -b 115200
;   Port: CH340 -> /dev/ttyUSB0 (needs the dialout group; ch341 driver is in-kernel)
; ============================================================================

[env:grinder_control]
; pioarduino arduino-esp32 3.x — same platform as the rest of the monorepo.
platform      = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21-2/platform-espressif32.zip
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
; This board bridges USB via CH340 (UART0), so do NOT enable native USB-CDC here.
; Serial is plain UART0; the port enumerates as /dev/ttyUSB0.

lib_extra_dirs = ../shared           ; esp_now_protocol.h — for the later ESP-NOW step
lib_deps =
    bodmer/TFT_eSPI@^2.5.43

build_flags =
    ; ---- GC9A01 round display, Sunton ESP32-2424S012 pinout ----
    -D USER_SETUP_LOADED
    -D GC9A01_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    -D TFT_MISO=-1           ; GC9A01 is write-only
    -D TFT_MOSI=7
    -D TFT_SCLK=6
    -D TFT_CS=10
    -D TFT_DC=2
    -D TFT_RST=-1            ; tied to board reset on this board; set a pin if screen stays blank
    -D TFT_BL=3             ; backlight
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD
    -D LOAD_FONT2
    -D LOAD_FONT4
    -D SPI_FREQUENCY=40000000
